name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Typecheck, lint, format, generated types, tests (with Postgres 16)
    runs-on: ubuntu-latest
    # A hard ceiling: a hung suite must fail the build rather than occupy a runner indefinitely.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yeonjae
          POSTGRES_PASSWORD: yeonjae
          POSTGRES_DB: yeonjae_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yeonjae -d yeonjae_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://yeonjae:yeonjae@127.0.0.1:5432/yeonjae_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated types are fresh (schemas are the contract)
        run: pnpm check:types-fresh
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Unit + Postgres integration tests
        run: pnpm test
        env:
          CI: 'true'
      - name: Integration tests actually ran (DATABASE_URL present)
        run: test -n "$DATABASE_URL"
      - name: Credential-free product suites actually ran (dependency status, preview, quality, export, batch)
        # Same reasoning as every guard above. These five suites are the only evidence that a required
        # dependency failing readiness, a preview never touching accepted content, a reproducible export
        # hash, and a batch refusing a cross-tenant item all hold. A silent skip would turn each of those
        # into an unverified claim.
        run: |
          grep -q "a REQUIRED component that is not serving fails readiness" coverage/junit.xml || {
            echo "::error::dependency-status tests did not run"; exit 1; }
          grep -q "creates a preview and leaves the accepted version byte-identical" coverage/junit.xml || {
            echo "::error::regeneration-preview tests did not run"; exit 1; }
          grep -q "never treats an apostrophe as an unmatched bracket" coverage/junit.xml || {
            echo "::error::typography tests did not run"; exit 1; }
          grep -q "never claims that a real platform accepted the content" coverage/junit.xml || {
            echo "::error::offline platform-format tests did not run"; exit 1; }
          grep -q "two preparations of identical state produce identical logical hashes" coverage/junit.xml || {
            echo "::error::deterministic export tests did not run"; exit 1; }
          grep -q "refuses a CROSS-TENANT item without failing the whole batch" coverage/junit.xml || {
            echo "::error::batch-operation tests did not run"; exit 1; }
      - name: No test was skipped
        # A skipped test is an unverified claim wearing a green check. Integration suites skip visibly
        # when DATABASE_URL is absent — which is exactly the accident this gate exists to catch, because
        # CI always provides one.
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const xml = readFileSync("coverage/junit.xml", "utf8");
            const skipped = [...xml.matchAll(/skipped="(\d+)"/g)].reduce((n, m) => n + Number(m[1]), 0);
            if (skipped > 0) { console.error(`::error::${skipped} test(s) were skipped`); process.exit(1); }
            const tests = [...xml.matchAll(/ tests="(\d+)"/g)].reduce((n, m) => n + Number(m[1]), 0);
            console.log(`no tests skipped (${tests} reported in the final suite run)`);
          '
      - name: Durable orchestration tests actually ran (worker + Temporal test server)
        # The worker suite runs against Temporal's locally downloaded time-skipping test server, so a
        # silent skip would hide the only proof of restart/replay/duplicate-start behaviour.
        run: |
          grep -q "durable orchestration" coverage/junit.xml || {
            echo "::error::apps/worker orchestration tests did not run"; exit 1; }
      - name: Operator web tests actually ran (journeys, accessibility, keyboard paths)
        # Same reasoning as the orchestration guard above: apps/web's suites are the only proof that the
        # operator journeys, the axe checks on every work area and the keyboard critical path hold. A
        # silently skipped web suite would turn "web is covered" into an unverified claim.
        run: |
          grep -q "keyboard-only critical path" coverage/junit.xml || {
            echo "::error::apps/web journey tests did not run"; exit 1; }
          grep -q "has no accessibility violations" coverage/junit.xml || {
            echo "::error::apps/web accessibility tests did not run"; exit 1; }
      - name: 120-chapter continuity replay actually ran (B-4-1 deterministic portion)
        # Same reasoning as the guards above. This suite is the only long-form evidence that chapter k
        # inherits chapter k−1's ACCEPTED state across 120 links, that canon advances exactly once per
        # acceptance, and that retry/resume duplicates nothing — a silent skip would turn all of that
        # into an unverified claim.
        run: |
          grep -q "B-4-1 120-chapter replay completion evidence" coverage/junit.xml || {
            echo "::error::the 120-chapter continuity replay did not run"; exit 1; }
      - name: 120-chapter continuity replay, explicit run with its no-skip guard
        # `pnpm test:replay-120` refuses to start without DATABASE_URL and fails unless the suite's own
        # completion evidence records a full 120-chapter run with zero replay misses and zero live
        # provider calls. No credentials and no paid provider are involved.
        run: pnpm test:replay-120
        env:
          CI: 'true'
      - name: Chaos and fallback drills, explicit run with its no-skip guard
        # `pnpm test:chaos` refuses to start without DATABASE_URL and fails unless the chaos report records
        # every declared scenario as passed, with no duplicate ids and no live provider call. Deterministic
        # faults only: no credentials and no paid provider are involved.
        run: pnpm test:chaos
        env:
          CI: 'true'
      - name: Deterministic chaos and provider-fallback drills actually ran (B-4-2)
        # The fallback matrix is the only evidence that fallback is AUTHORIZED rather than merely possible:
        # a rejected request, an auth failure or an unknown fault must not be rerouted to a second paid
        # model. A silent skip would turn that into an unverified claim.
        #
        # This guard reads the suite's OWN durable report rather than coverage/junit.xml, because every
        # vitest invocation rewrites junit.xml — so a grep here would only ever see the last suite that
        # ran, which is exactly how the first version of this guard failed. The report is written by the
        # suites themselves and verified independently by the runner above.
        run: |
          node -e '
            const r = require("./coverage/chaos-report.json");
            const ids = (r.scenarios ?? []).map((s) => s.id);
            const gw = ids.filter((i) => i.startsWith("GW-")).length;
            const wf = ids.filter((i) => i.startsWith("WF-")).length;
            if (gw < 30) { console.error(`::error::gateway fault matrix reported ${gw} scenarios, expected >= 30`); process.exit(1); }
            if (wf < 19) { console.error(`::error::workflow fault matrix reported ${wf} scenarios, expected >= 19`); process.exit(1); }
            if ((r.scenarios ?? []).some((s) => s.outcome !== "passed")) { console.error("::error::a chaos scenario did not pass"); process.exit(1); }
            console.log(`chaos matrices ran: ${gw} gateway + ${wf} workflow scenarios`);
          '
      - name: Active provider-request cancellation tests actually ran (Phase 4)
        # Same reasoning as the guards above. These suites are the only evidence that a durable cancel
        # reaches an ALREADY-RUNNING provider request — that no retry, repair or fallback starts after an
        # authoritative cancellation, that a late response is discarded, that a cancelled call's billing
        # is recorded as unknown rather than zero, and that a cancel after the atomic commit does not
        # retract accepted canon. A silent skip would turn every one of those into an unverified claim.
        run: |
          grep -q "aborts a blocking deterministic provider operation mid-call" coverage/junit.xml || {
            echo "::error::gateway active-cancellation tests did not run"; exit 1; }
          grep -q "cancels a provider call that is held open" coverage/junit.xml || {
            echo "::error::durable active-cancellation integration tests did not run"; exit 1; }
      - name: Disposable backup/restore drill, explicit run with its no-skip guard (B-4-3)
        # `pnpm drill:restore` creates its own disposable PostgreSQL databases, applies every migration,
        # seeds representative multi-tenant data, dumps and restores it, and verifies 22 invariants
        # (schema, RLS policies AND enforcement, immutable chains, canon continuity, evidence offsets,
        # accepted-only boundaries, quarantine exclusion, job/checkpoint state, attempt provenance, cost
        # totals, sequence safety). It refuses to run without DATABASE_URL and refuses any target that is
        # not local, explicitly marked disposable and created by the drill itself.
        #
        # This is a LOGICAL dump/restore. The guard fails if the report ever claims PITR, staging,
        # production or off-site coverage, none of which are exercised here.
        run: pnpm drill:restore
        env:
          CI: 'true'
      - name: Restore drill completion evidence (read from its own durable report)
        # Same reasoning as the chaos guard: every vitest invocation rewrites coverage/junit.xml, so this
        # reads the drill's dedicated report instead.
        run: |
          node -e '
            const r = require("./coverage/restore-drill-report.json");
            if (r.passed !== true) { console.error("::error::the restore drill did not pass"); process.exit(1); }
            if (r.source_unchanged !== true) { console.error("::error::the drill did not verify the source unchanged"); process.exit(1); }
            const passed = (r.invariants ?? []).filter((i) => i.outcome === "passed").length;
            if (passed < 22) { console.error(`::error::restore drill reported ${passed} passing invariants, expected >= 22`); process.exit(1); }
            console.log(`restore drill: ${passed} invariants passed on PostgreSQL ${r.postgres_version}`);
          '
      - name: Defensive security suite, explicit run with its no-skip guard (B-4-4)
        # `pnpm test:security` runs the tenant-isolation, authentication/authorization, input/output,
        # telemetry and rate-limit boundary suites and verifies its own durable report. Defensive only:
        # the suites drive the app's local test client with inert inputs and assert REFUSAL. No scanner,
        # no brute-force, no credential harvesting, no command-execution demonstration.
        #
        # The RLS half needs real PostgreSQL 16, so the runner refuses to start without DATABASE_URL —
        # a silently skipped isolation suite proves nothing about tenant isolation.
        run: pnpm test:security
        env:
          CI: 'true'
      - name: Defensive security evidence (read from its own durable report)
        run: |
          node -e '
            const r = require("./coverage/security-report.json");
            const s = r.scenarios ?? [];
            if (r.defensive_only !== true) { console.error("::error::security report does not declare itself defensive-only"); process.exit(1); }
            if (s.some((x) => x.outcome !== "passed")) { console.error("::error::a security scenario did not pass"); process.exit(1); }
            for (const surface of ["rls", "input_output", "telemetry", "rate_limit"]) {
              if (!s.some((x) => x.surface === surface)) { console.error(`::error::no scenario covers the ${surface} surface`); process.exit(1); }
            }
            if (s.length < 16) { console.error(`::error::security suite reported ${s.length} scenarios, expected >= 16`); process.exit(1); }
            console.log(`defensive security: ${s.length} scenarios passed`);
          '
      - name: Deterministic cost and attempt accounting, explicit run with its no-skip guard (B-4-6)
        # `pnpm test:costs` replays 13 fixture scenarios through the real append-only audit and verifies
        # its own durable report: every actual attempt attributable, per-attempt attribution
        # reconstructing (never adding to) the authoritative total, retries and fallbacks visible, a
        # replay unable to double-charge, partial/unknown usage staying unknown, integer arithmetic, and
        # tenant isolation.
        #
        # The evidence is SYNTHETIC/replay. The guard fails if the report ever claims real billing
        # calibration, which would need a provider invoice this system does not observe.
        run: pnpm test:costs
        env:
          CI: 'true'
      - name: Deterministic cost evidence (read from its own durable report)
        run: |
          node -e '
            const r = require("./coverage/cost-report.json");
            const s = r.scenarios ?? [];
            if (r.basis !== "synthetic_replay") { console.error(`::error::unexpected cost basis ${r.basis}`); process.exit(1); }
            if (r.real_billing_calibrated !== false) { console.error("::error::cost report claims real billing calibration"); process.exit(1); }
            if (r.live_provider_calls !== 0) { console.error("::error::cost report records a live provider call"); process.exit(1); }
            if (s.some((x) => x.outcome !== "passed")) { console.error("::error::a cost scenario did not pass"); process.exit(1); }
            if (s.length < 13) { console.error(`::error::cost suite reported ${s.length} scenarios, expected >= 13`); process.exit(1); }
            console.log(`deterministic cost accounting: ${s.length} scenarios passed (basis ${r.basis})`);
          '
      - name: Deterministic contrast regression (no credentials, no provider calls)
        run: pnpm validate:contrast
      - name: Extended end-to-end readiness and product scenario, with its no-skip guard
        # `pnpm test:e2e-readiness` is the ONE ordered run through real boundaries: it migrates a clean
        # database, comes up healthy, produces a chapter through the real workflow, and then exercises
        # every credential-free product surface — dependency status through degraded and unavailable and
        # back, a regeneration preview that must not touch accepted content, typography and offline
        # platform-format checks, a reproducible export, a bounded batch with partial failure and an
        # eligible-only retry, tenant isolation, accounting, drain and leak checks.
        #
        # It refuses to pass if a declared stage was skipped, which is what stops the suite from passing
        # by doing less. Deterministic replay only: no credentials and no paid provider.
        run: pnpm test:e2e-readiness
        env:
          CI: 'true'
      - name: Extended readiness scenario evidence (read from its own durable report)
        # Its own report rather than coverage/junit.xml, for the reason the chaos guard documents: every
        # vitest invocation rewrites junit.xml, so a grep there would only see the last suite that ran.
        run: |
          node -e '
            const r = require("./coverage/readiness-scenario-report.json");
            const stages = r.stages ?? [];
            const required = [
              "dependencies_healthy", "optional_dependency_degraded",
              "required_dependency_unavailable", "readiness_failed_correctly",
              "dependency_recovered", "preview_created", "accepted_content_unchanged",
              "preview_resolved", "typography_checked", "platform_format_checked",
              "export_prepared", "export_manifest_verified", "export_reproduced",
              "batch_completed", "batch_partial_failure", "batch_retry_eligible_only",
              "product_tenant_isolation_proved", "product_accounting_verified",
              "product_drained", "no_resource_leaked",
            ];
            const done = new Set(stages.map((s) => s.name));
            const missing = required.filter((s) => !done.has(s));
            if (missing.length > 0) { console.error(`::error::readiness scenario skipped stages: ${missing.join(", ")}`); process.exit(1); }
            if (stages.some((s) => s.ok !== true)) { console.error("::error::a readiness scenario stage did not pass"); process.exit(1); }
            if (stages.length < 40) { console.error(`::error::readiness scenario reported ${stages.length} stages, expected >= 40`); process.exit(1); }
            if (r.zero_live_calls !== true || r.zero_real_credentials !== true) {
              console.error("::error::the readiness scenario does not declare zero live calls and zero real credentials"); process.exit(1); }
            console.log(`readiness + product scenario: ${stages.length} stages passed`);
          '
      - name: Bounded performance smoke tests, explicit run
        # Separate from the correctness suites on purpose: a perf regression must be visible as its own
        # failure rather than as a slow test somewhere in the main run.
        run: pnpm test:perf-smoke
        env:
          CI: 'true'
      - name: CLI smoke against the migrated database
        run: |
          pnpm --silent cli db:migrate
          pnpm --silent cli project:create "ci smoke" > /tmp/p.json
          cat /tmp/p.json
      - name: API startup smoke test
        run: |
          pnpm --filter @yeonjae/api start &
          API_PID=$!
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:8080/ready
          # An unauthenticated protected route must answer 401 with a problem document, not data.
          code=$(curl -s -o /tmp/unauth.json -w '%{http_code}' http://127.0.0.1:8080/v1/projects)
          test "$code" = "401" || { echo "::error::unauthenticated /v1/projects returned $code"; exit 1; }
          kill $API_PID
        env:
          YEONJAE_INSECURE_COOKIES: 'true'
      - name: Worker startup smoke test (refuses to start without an explicit provider mode)
        run: |
          # No YEONJAE_PROVIDER_MODE: the worker must refuse rather than defaulting to a paid provider.
          if pnpm --filter @yeonjae/worker start 2>/tmp/worker.err; then
            echo "::error::worker started without YEONJAE_PROVIDER_MODE"; exit 1
          fi
          grep -q "YEONJAE_PROVIDER_MODE" /tmp/worker.err || {
            echo "::error::worker failure did not name the missing provider mode"; cat /tmp/worker.err; exit 1; }
      - name: Operator web production build
        run: pnpm build:web
      - name: Web startup smoke test (the built app serves the operator console)
        run: |
          pnpm --filter @yeonjae/web start &
          WEB_PID=$!
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ > /tmp/web.html; then break; fi
            sleep 1
          done
          # The shell must actually render: a 200 that returned an error page would pass a bare curl.
          grep -q "Yeonjae Studio" /tmp/web.html || {
            echo "::error::web app did not render the operator shell"; head -c 2000 /tmp/web.html; exit 1; }
          grep -q "Skip to main content" /tmp/web.html || {
            echo "::error::web app rendered without its accessibility landmarks"; exit 1; }
          kill $WEB_PID
      - name: Dependency audit (high and critical advisories fail the build)
        # The previous form ended in `|| (echo ... && exit 0)`, so despite its name it converted every
        # finding into a success and the gate never existed. High/critical advisories now fail. A finding
        # that must be tolerated goes in .audit-allowlist.json with a justification, scope and expiry, so
        # the exception is reviewable and cannot outlive its review.
        run: node tools/audit-gate.mjs

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
